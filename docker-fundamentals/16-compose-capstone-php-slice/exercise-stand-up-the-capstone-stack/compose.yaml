name: capstone-php-slice

services:
  web:
    image: nginx:stable-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public:/var/www/html/public:ro

  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-capstone}
      DB_USERNAME: ${MYSQL_USER:-capstone}
      DB_PASSWORD: ${MYSQL_PASSWORD:-capstone}
      REDIS_HOST: redis
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-capstone}
      MYSQL_USER: ${MYSQL_USER:-capstone}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-capstone}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

volumes:
  db_data:
  redis_data:
