services:
  web:
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: capstone-php-slice:dev
    volumes:
      - .:/var/www/html
      - ./app/public:/var/www/html/public
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      XDEBUG_MODE: debug,develop
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: capstone-php-slice:dev
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: capstone-php-slice:dev
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
