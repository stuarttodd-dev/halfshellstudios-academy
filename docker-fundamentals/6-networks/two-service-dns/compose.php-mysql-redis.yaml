name: ch6-php-mysql-redis

services:
  app:
    image: php:8.3-cli
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
