# Lesson 6.6 — depends_on starts db before probe, but does NOT wait for MySQL ready
name: ch6-refused-demo

services:
  probe:
    image: busybox:1.36
    command: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_started

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: app
