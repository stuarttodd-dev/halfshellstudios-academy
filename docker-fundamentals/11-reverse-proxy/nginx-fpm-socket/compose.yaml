name: ch11-fastcgi

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default-tcp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    image: php:8.3-fpm-alpine
    expose:
      - "9000"
    working_dir: /var/www/html
    environment:
      FASTCGI_VIA: tcp
    volumes:
      - ./:/var/www/html
