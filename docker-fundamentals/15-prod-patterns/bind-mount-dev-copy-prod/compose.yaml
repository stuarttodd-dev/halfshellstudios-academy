name: ch15-bind

services:
  app:
    image: ch15-bind:local
    command: php -S 0.0.0.0:8080 -t public
    expose:
      - "8080"

  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
