services:
  app:
    image: ch15-split-exercise:release
    read_only: true
    user: "33:33"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=8m,mode=755
    volumes:
      - app-storage:/var/www/html/storage

volumes:
  app-storage:
