name: ch12-health-exercise

services:
  app:
    build: .
    ports:
      - "127.0.0.1:9001:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET
          cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -qx pong || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
