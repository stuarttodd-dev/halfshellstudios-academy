name: ch10-fpm-health

services:
  app:
    build: .
    image: ch10-fpm-health:local
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET
          cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -qx pong || exit 1
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
