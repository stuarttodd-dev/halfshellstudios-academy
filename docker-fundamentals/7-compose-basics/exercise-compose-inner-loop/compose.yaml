# Exercise 7.9–7.10 — Compose operator inner loop (web, php, db)
name: ch7compose-loop

services:
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      - php

  php:
    image: php:8.3-fpm-bookworm
    environment:
      APP_ENV: local
      DB_HOST: db
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: ${DB_PASSWORD:-devpass}
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
