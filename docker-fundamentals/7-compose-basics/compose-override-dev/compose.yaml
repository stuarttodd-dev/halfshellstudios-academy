# Shared stack — team contract (lesson 7.6 base)
name: ch7stack

services:
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: php:8.3-fpm-bookworm
    environment:
      APP_ENV: local
      DB_HOST: db
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: ${DB_PASSWORD:-devpass}
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
